<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Colis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F4F4F2;--surface:#FFF;--text:#111;--text2:#888;--text3:#BBB;--border:#EBEBEB;--accent:#FF6B35;--accent-bg:#FFF3ED;--green:#22C55E;--green-bg:#F0FDF4;--blue:#3B82F6;--blue-bg:#EFF6FF;--yellow:#EAB308;--yellow-bg:#FEFCE8;--red:#EF4444;--red-bg:#FEF2F2;--sh:0 1px 3px rgba(0,0,0,.04);--shh:0 6px 20px rgba(0,0,0,.06);--r:16px;--font:'Outfit',sans-serif;--sab:env(safe-area-inset-bottom,0px)}
html{font-size:16px;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:0 20px 120px}
header{padding:52px 0 28px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.8rem;font-weight:700;letter-spacing:-.03em}
.ha{display:flex;gap:8px}
.hb{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s;-webkit-tap-highlight-color:transparent}
.hb:hover{color:var(--text);background:var(--border)}
.hb.active{color:var(--accent);background:var(--accent-bg)}
.hb svg{width:18px;height:18px}
.ab{padding:12px 16px;border-radius:12px;font-size:.8rem;font-weight:500;margin-bottom:20px;display:flex;align-items:center;gap:8px;cursor:pointer}
.ab.off{background:var(--yellow-bg);color:#92400E}
.ab.on{background:var(--green-bg);color:#166534;cursor:default}
.ab svg{width:16px;height:16px;flex-shrink:0}
.fl{display:flex;gap:6px;margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.fl::-webkit-scrollbar{display:none}
.fb{padding:8px 18px;border-radius:50px;border:none;background:var(--surface);font-family:var(--font);font-size:.8rem;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .2s;-webkit-tap-highlight-color:transparent}
.fb.a{background:var(--text);color:#fff}
.emp{text-align:center;padding:80px 20px;animation:fu .4s ease}
.emp-i{font-size:2.5rem;margin-bottom:16px}
.emp h3{font-size:1rem;font-weight:600;margin-bottom:4px}
.emp p{font-size:.85rem;color:var(--text2)}
.ls{display:flex;flex-direction:column;gap:10px}
.cd{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);transition:box-shadow .2s;animation:fu .3s ease both}
.cd:hover{box-shadow:var(--shh)}
.cr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cl{flex:1;min-width:0}
.cn{font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:.75rem;color:var(--text2);margin-top:2px}
.ca{display:flex;gap:2px;flex-shrink:0}
.cb{width:32px;height:32px;border:none;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;-webkit-tap-highlight-color:transparent;text-decoration:none}
.cb:hover{background:var(--bg);color:var(--text2)}
.cb.dl:hover{color:var(--red)}
.cb.sy{color:var(--accent)}
.cb.sy.ld svg{animation:sp .8s linear infinite}
.cb svg{width:15px;height:15px}
.bg{display:inline-block;padding:4px 10px;border-radius:50px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.02em;margin-top:10px}
.bg.commande{background:var(--blue-bg);color:var(--blue)}
.bg.expedie{background:var(--yellow-bg);color:#A16207}
.bg.transit{background:var(--accent-bg);color:var(--accent)}
.bg.livre{background:var(--green-bg);color:#16A34A}
.ds{display:flex;align-items:center;gap:0;margin-top:12px}
.dd{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dd.done{background:var(--green)}
.dd.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dl2{flex:1;height:2px;background:var(--border)}
.dl2.done{background:var(--green)}
.tt{display:flex;align-items:center;gap:6px;margin-top:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tt span{font-size:.72rem;font-weight:500;color:var(--text3)}
.tt svg{width:14px;height:14px;color:var(--text3);transition:transform .2s}
.tt.op svg{transform:rotate(180deg)}
.tl{display:none;padding-top:12px}
.tl.sh{display:block}
.ti{display:flex;gap:10px;padding-bottom:12px}
.ti:last-child{padding-bottom:0}
.tr{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.td{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.ti:first-child .td{background:var(--accent)}
.tw{width:1.5px;flex:1;background:var(--border);margin-top:3px}
.ti:last-child .tw{display:none}
.te{font-size:.78rem;font-weight:500;color:var(--text)}
.tm{font-size:.68rem;color:var(--text3);margin-top:1px}
.as{display:flex;align-items:center;gap:5px;margin-top:10px;padding:6px 10px;border:1.5px dashed var(--border);border-radius:8px;background:none;font-family:var(--font);font-size:.72rem;font-weight:500;color:var(--text3);cursor:pointer;width:100%;transition:all .2s;-webkit-tap-highlight-color:transparent}
.as:hover{border-color:var(--accent);color:var(--accent)}
.as svg{width:12px;height:12px}
.fab{position:fixed;bottom:calc(24px + var(--sab));right:50%;transform:translateX(calc(min(240px,50vw - 20px)));width:52px;height:52px;border-radius:50%;border:none;background:var(--text);color:#fff;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;transition:all .2s;-webkit-tap-highlight-color:transparent;z-index:100}
.fab:active{transform:translateX(calc(min(240px,50vw - 20px))) scale(.92)}
.fab svg{width:22px;height:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.op{opacity:1;pointer-events:all}
.sh{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px 22px calc(22px + var(--sab));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:88dvh;overflow-y:auto}
.ov.op .sh{transform:translateY(0)}
.sb{width:32px;height:3px;border-radius:3px;background:var(--border);margin:0 auto 20px}
.sh h2{font-size:1.15rem;font-weight:700;margin-bottom:22px;letter-spacing:-.02em}
.fd{margin-bottom:16px}
.fd label{display:block;font-size:.72rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fd input,.fd textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font);font-size:.88rem;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;-webkit-appearance:none}
.fd input:focus,.fd textarea:focus{border-color:var(--accent)}
.fd textarea{resize:none;min-height:60px}
.fh{font-size:.68rem;color:var(--text3);margin-top:4px}
.dt{display:none;align-items:center;gap:6px;margin-top:6px;padding:8px 12px;border-radius:8px;background:var(--green-bg);font-size:.78rem;font-weight:500;color:#16A34A}
.dt.sh2{display:flex}
.dt svg{width:14px;height:14px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.so{padding:10px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font);font-size:.8rem;font-weight:500;text-align:center;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--text2)}
.so.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbt{display:flex;gap:8px;margin-top:22px}
.bt{flex:1;padding:13px;border-radius:10px;border:none;font-family:var(--font);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.bm{background:var(--text);color:#fff}
.bm:active{transform:scale(.98)}
.bg2{background:var(--bg);color:var(--text2)}
.br{background:var(--red);color:#fff}
.co{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.co.op{opacity:1;pointer-events:all}
.cx{background:var(--surface);border-radius:var(--r);padding:24px;max-width:320px;width:100%;text-align:center;transform:scale(.9);transition:transform .2s}
.co.op .cx{transform:scale(1)}
.cx h3{font-size:1rem;font-weight:600;margin-bottom:6px}
.cx p{font-size:.82rem;color:var(--text2);margin-bottom:18px}
.ts2{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:500;pointer-events:none}
.to{background:var(--text);color:#fff;padding:10px 20px;border-radius:50px;font-size:.8rem;font-weight:500;animation:ti .3s ease,to2 .3s ease 2.5s forwards;pointer-events:auto}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}
@keyframes to2{to{opacity:0}}
@media(prefers-color-scheme:dark){
:root{--bg:#0E0E0E;--surface:#1A1A1A;--text:#F5F5F5;--text2:#777;--text3:#444;--border:#262626;--accent:#FF7A45;--accent-bg:#261A12;--green:#34D399;--green-bg:#0D2618;--blue:#60A5FA;--blue-bg:#0C1A2E;--yellow:#FACC15;--yellow-bg:#1C1A0A;--red:#F87171;--red-bg:#2A1010;--sh:0 1px 3px rgba(0,0,0,.2);--shh:0 6px 20px rgba(0,0,0,.3)}
.fab,.bm{background:var(--accent)}
.fb.a{background:var(--accent)}
.to{background:var(--surface);color:var(--text);border:1px solid var(--border)}
}
</style>
</head>
<body>
<div class="ts2" id="toasts"></div>
<div class="app">
<header><h1>Colis</h1><div class="ha"><button class="hb" id="setBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button><button class="hb" id="notBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button></div></header>
<div id="apb"></div>
<div class="fl" id="fl"><button class="fb a" data-f="all">Tout</button><button class="fb" data-f="commande">Commandé</button><button class="fb" data-f="expedie">Expédié</button><button class="fb" data-f="transit">En transit</button><button class="fb" data-f="livre">Livré</button></div>
<div class="ls" id="ls"></div>
</div>
<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
<div class="ov" id="md"><div class="sh"><div class="sb"></div><h2 id="mt">Nouveau colis</h2><div class="fd"><label>Nom</label><input id="iN" placeholder="Ex : iPhone 16, Nike…"></div><div class="fd"><label>Numéro de suivi</label><input id="iT" placeholder="Colle ton numéro ici"><div class="dt" id="det"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span id="dn"></span></div></div><div class="fd"><label>Transporteur</label><input id="iC" placeholder="Auto-détecté ou saisir"></div><div class="fd"><label>Statut</label><div class="sg" id="sg"><div class="so sel" data-s="commande">Commandé</div><div class="so" data-s="expedie">Expédié</div><div class="so" data-s="transit">En transit</div><div class="so" data-s="livre">Livré</div></div></div><div class="r2"><div class="fd"><label>Livraison estimée</label><input type="date" id="iE"></div><div class="fd"><label>Commandé le</label><input type="date" id="iO"></div></div><div class="fd"><label>Note</label><textarea id="iNo" placeholder="Optionnel" rows="2"></textarea></div><div class="sbt"><button class="bt bg2" id="mc">Annuler</button><button class="bt bm" id="ms">Ajouter</button></div></div></div>
<div class="ov" id="em"><div class="sh"><div class="sb"></div><h2>Ajouter une étape</h2><div class="fd"><label>Description</label><input id="eD" placeholder="Ex : Centre de tri Lyon"></div><div class="r2"><div class="fd"><label>Date</label><input type="date" id="eDt"></div><div class="fd"><label>Heure</label><input type="time" id="eTm"></div></div><div class="fd"><label>Lieu</label><input id="eL" placeholder="Optionnel"></div><div class="sbt"><button class="bt bg2" id="ec">Annuler</button><button class="bt bm" id="es">Ajouter</button></div></div></div>
<div class="ov" id="sm"><div class="sh"><div class="sb"></div><h2>Paramètres</h2><div class="fd"><label>URL Cloudflare Worker</label><input id="sU" placeholder="https://xxx.workers.dev"><div class="fh">Ton Worker qui fait le relais avec Ship24</div></div><div class="sbt"><button class="bt bg2" id="sc">Annuler</button><button class="bt bm" id="ss">Enregistrer</button></div></div></div>
<div class="co" id="cf"><div class="cx"><h3>Supprimer ?</h3><p>Ce colis sera supprimé.</p><div style="display:flex;gap:8px"><button class="bt bg2" id="cn">Annuler</button><button class="bt br" id="cy">Supprimer</button></div></div></div>
<script>
const SK='colis-app-data',NK='colis-notif',WK='colis-worker';
const STS=['commande','expedie','transit','livre'];
const SL={commande:'Commandé',expedie:'Expédié',transit:'En transit',livre:'Livré'};
let D=JSON.parse(localStorage.getItem(SK)||'[]'),nf=localStorage.getItem(NK)==='1',wk=localStorage.getItem(WK)||'',ft='all',eId=null,dId=null,evT=null;
const CS=[{n:'Colissimo',p:[/^[0-9]{11}[A-Z]{2}$/i,/^[0-9]{13}$/],u:t=>'https://www.laposte.fr/outils/suivre-vos-envois?code='+t},{n:'La Poste',p:[/^[A-Z]{2}[0-9]{9}[A-Z]{2}$/i,/^[0-9]{15}$/],u:t=>'https://www.laposte.fr/outils/suivre-vos-envois?code='+t},{n:'Chronopost',p:[/^X[A-Z][0-9]{10}/i],u:t=>'https://www.chronopost.fr/tracking-no-powerful/tracking-unified/?langue=fr&numLT='+t},{n:'UPS',p:[/^1Z[A-Z0-9]{16}$/i],u:t=>'https://www.ups.com/track?tracknum='+t+'&loc=fr_FR'},{n:'FedEx',p:[/^[0-9]{12}$/,/^[0-9]{15}$/,/^[0-9]{22}$/],u:t=>'https://www.fedex.com/fedextrack/?trknbr='+t},{n:'DHL',p:[/^[0-9]{10}$/,/^JJD[0-9]{18}/i],u:t=>'https://www.dhl.com/fr-fr/home/suivi.html?tracking-id='+t},{n:'Mondial Relay',p:[/^[0-9]{8}$/,/^[0-9]{12}$/],u:t=>'https://www.mondialrelay.fr/suivi-de-colis?numExp='+t},{n:'GLS',p:[/^[A-Z0-9]{11}$/i],u:t=>'https://gls-group.eu/FR/fr/suivi-colis?match='+t},{n:'DPD',p:[/^[0-9]{14}$/],u:t=>'https://trace.dpd.fr/fr/trace/'+t},{n:'Amazon',p:[/^TB[A-Z0-9]{10,}/i],u:t=>'https://track.amazon.fr/tracking/'+t},{n:'Cainiao',p:[/^LP[0-9]{14,}/i,/^R[A-Z][0-9]{9}[A-Z]{2}$/i],u:t=>'https://global.cainiao.com/detail.htm?mailNoList='+t}];
function det(t){if(!t||t.length<6)return null;t=t.trim().replace(/\s/g,'');for(const c of CS)for(const p of c.p)if(p.test(t))return c;return null}
function tUrl(d){if(!d.tracking)return null;const c=det(d.tracking);return c?c.u(d.tracking.trim()):'https://www.google.com/search?q=suivi+colis+'+encodeURIComponent(d.tracking)}
function mSt(s){if(!s)return null;s=s.toLowerCase();if(s.includes('delivered')||s.includes('pickup'))return'livre';if(s.includes('transit')||s.includes('customs')||s.includes('out_for'))return'transit';if(s.includes('shipped')||s.includes('label')||s.includes('info'))return'expedie';return'transit'}
async function sync(id){const d=D.find(x=>x.id===id);if(!d||!d.tracking||!wk){toast(wk?'Pas de suivi':'Configure l\'API');return}const b=document.querySelector('[data-id="'+id+'"] .cb.sy');if(b)b.classList.add('ld');try{const r=await fetch(wk,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'track',trackingNumber:d.tracking})});const j=await r.json();if(j.data&&j.data.trackings&&j.data.trackings[0]){const tk=j.data.trackings[0];if(tk.shipment&&tk.shipment.statusCode){const ns=mSt(tk.shipment.statusCode);if(ns){if(d.status!=='livre'&&ns==='livre'){sN('Livré !',d.name);toast(d.name+' livré !')}d.status=ns}}if(tk.shipment&&tk.shipment.delivery&&tk.shipment.delivery.estimatedDeliveryDate)d.eta=tk.shipment.delivery.estimatedDeliveryDate.split('T')[0];if(tk.events&&tk.events.length){if(!d.events)d.events=[];const ks=new Set(d.events.map(e=>e.desc+e.date));let n=0;tk.events.forEach(ev=>{const dt=ev.datetime?new Date(ev.datetime):new Date();const ds=ev.status||'Mise à jour';const da=dt.toISOString().split('T')[0];if(!ks.has(ds+da)){d.events.push({id:gid(),desc:ds,date:da,time:dt.toTimeString().slice(0,5),location:ev.location||'',api:1});ks.add(ds+da);n++}});if(n)toast(n+' étape'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''))}if(!d.source&&tk.events&&tk.events[0]&&tk.events[0].courierCode)d.source=tk.events[0].courierCode;d.updatedAt=Date.now();sv();render()}else toast('Aucune info trouvée')}catch(e){toast('Erreur : '+e.message)}finally{if(b)b.classList.remove('ld')}}
async function aN(){if(!('Notification'in window))return false;if(Notification.permission==='granted')return true;return(await Notification.requestPermission())==='granted'}
function sN(t,b){if(!nf||Notification.permission!=='granted')return;try{new Notification(t,{body:b})}catch(e){}}
function cE(){if(!nf)return;const td=new Date;td.setHours(0,0,0,0);D.forEach(d=>{if(d.status==='livre'||!d.eta)return;const e=new Date(d.eta);e.setHours(0,0,0,0);const df=Math.ceil((e-td)/864e5);const k='n-'+d.id+'-'+df;if(localStorage.getItem(k))return;if(df===0){sN('Aujourd\'hui !',d.name);localStorage.setItem(k,'1')}else if(df===1){sN('Demain',d.name);localStorage.setItem(k,'1')}})}
function sv(){localStorage.setItem(SK,JSON.stringify(D))}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fD(t){return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function toast(m){const t=document.createElement('div');t.className='to';t.textContent=m;_('toasts').appendChild(t);setTimeout(()=>t.remove(),3000)}
function gS(){const e=_('sg').querySelector('.sel');return e?e.dataset.s:'commande'}
function sS(s){_('sg').querySelectorAll('.so').forEach(e=>e.classList.toggle('sel',e.dataset.s===s))}
const _=id=>document.getElementById(id);
