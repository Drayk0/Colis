<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Colis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--surface:#1C1C1E;--surface2:#2C2C2E;--text:#FFF;--text2:rgba(255,255,255,.55);--text3:rgba(255,255,255,.3);
  --accent:#F0883E;--accent-bg:rgba(240,136,62,.15);--green:#34C759;--green-bg:rgba(52,199,89,.15);
  --blue:#0A84FF;--blue-bg:rgba(10,132,255,.15);--yellow:#FFD60A;--yellow-bg:rgba(255,214,10,.15);
  --red:#FF453A;--separator:rgba(255,255,255,.08);
  --font:'Inter',system-ui,-apple-system,sans-serif;--sab:env(safe-area-inset-bottom,0px);
}
html{font-size:16px;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
.app{max-width:500px;margin:0 auto;padding:0 20px;padding-bottom:calc(90px + var(--sab))}

/* ── Header ── */
header{padding:56px 0 8px}
.gear{width:44px;height:44px;border-radius:50%;background:var(--surface);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);margin-bottom:12px;-webkit-tap-highlight-color:transparent;transition:background .15s}
.gear:hover{background:var(--surface2)}
.gear svg{width:22px;height:22px}
header h1{font-size:2.2rem;font-weight:800;letter-spacing:-.03em}

/* ── Empty ── */
.empty{display:flex;align-items:center;justify-content:center;min-height:50vh}
.empty p{color:var(--text2);font-size:.95rem;text-align:center;line-height:1.5}

/* ── Cards ── */
.list{display:flex;flex-direction:column;gap:2px;margin-top:24px}
.card{background:var(--surface);padding:16px 18px;transition:background .15s;animation:fu .3s ease both;cursor:default}
.card:first-child{border-radius:14px 14px 0 0}
.card:last-child{border-radius:0 0 14px 14px}
.card:only-child{border-radius:14px}
.card+.card{border-top:1px solid var(--separator)}
.card:active{background:var(--surface2)}

.card-row{display:flex;align-items:center;gap:14px}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem}
.card-icon.commande{background:var(--blue-bg);color:var(--blue)}
.card-icon.expedie{background:var(--yellow-bg);color:var(--yellow)}
.card-icon.transit{background:var(--accent-bg);color:var(--accent)}
.card-icon.livre{background:var(--green-bg);color:var(--green)}
.card-body{flex:1;min-width:0}
.card-name{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:.75rem;color:var(--text2);margin-top:2px}
.card-eta{font-size:.7rem;font-weight:600;color:var(--accent);margin-top:1px}
.card-chev{color:var(--text3);flex-shrink:0}
.card-chev svg{width:16px;height:16px}

/* ── Card Detail (expanded) ── */
.card-detail{display:none;padding-top:14px;margin-top:14px;border-top:1px solid var(--separator)}
.card.open .card-detail{display:block}

.dots-row{display:flex;align-items:center;gap:0;margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--surface2)}
.dot.done{background:var(--green)}
.dot.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dot-line{flex:1;height:2px;background:var(--surface2)}
.dot-line.done{background:var(--green)}

.tl-item{display:flex;gap:10px;padding-bottom:10px}
.tl-item:last-of-type{padding-bottom:0}
.tl-rail{display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0}
.tl-d{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;margin-top:4px}
.tl-item:first-of-type .tl-d{background:var(--accent)}
.tl-w{width:1px;flex:1;background:var(--separator);margin-top:3px}
.tl-item:last-of-type .tl-w{display:none}
.tl-t{font-size:.78rem;font-weight:500}
.tl-m{font-size:.68rem;color:var(--text2);margin-top:1px}

.detail-actions{display:flex;gap:8px;margin-top:14px}
.d-btn{flex:1;padding:10px;border-radius:10px;border:none;font-family:var(--font);font-size:.78rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.d-btn:active{opacity:.7}
.d-btn svg{width:14px;height:14px}
.d-sync{background:var(--accent-bg);color:var(--accent)}
.d-track{background:var(--blue-bg);color:var(--blue)}
.d-edit{background:var(--surface2);color:var(--text2)}
.d-del{background:rgba(255,69,58,.12);color:var(--red)}

/* ── Bottom Bar ── */
.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px 20px calc(12px + var(--sab));display:flex;align-items:center;justify-content:space-between;z-index:50;max-width:500px;margin:0 auto}
.b-btn{width:48px;height:48px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.b-btn:active{transform:scale(.9)}
.b-search{background:var(--surface);color:var(--text2)}
.b-search svg{width:22px;height:22px}
.b-add{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(240,136,62,.35)}
.b-add svg{width:24px;height:24px}

/* ── Overlays ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.op{opacity:1;pointer-events:all}
.sh{background:var(--surface);width:100%;max-width:500px;border-radius:16px 16px 0 0;padding:20px 22px calc(20px + var(--sab));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:88dvh;overflow-y:auto}
.ov.op .sh{transform:translateY(0)}
.sh-bar{width:36px;height:4px;border-radius:4px;background:var(--surface2);margin:0 auto 18px}
.sh h2{font-size:1.1rem;font-weight:700;margin-bottom:20px}

.fd{margin-bottom:16px}
.fd label{display:block;font-size:.72rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fd input,.fd textarea{width:100%;padding:12px 14px;border:none;border-radius:10px;font-family:var(--font);font-size:.88rem;color:var(--text);background:var(--surface2);outline:none;-webkit-appearance:none}
.fd input::placeholder,.fd textarea::placeholder{color:var(--text3)}
.fd textarea{resize:none;min-height:60px}
.fd-hint{font-size:.68rem;color:var(--text3);margin-top:4px}

.det{display:none;align-items:center;gap:6px;margin-top:6px;padding:8px 12px;border-radius:8px;background:var(--green-bg);font-size:.78rem;font-weight:500;color:var(--green)}
.det.on{display:flex}
.det svg{width:14px;height:14px}

.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.so{padding:10px;border:1.5px solid var(--surface2);border-radius:10px;font-family:var(--font);font-size:.8rem;font-weight:500;text-align:center;cursor:pointer;background:transparent;color:var(--text2);-webkit-tap-highlight-color:transparent;transition:all .15s}
.so.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}

.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbt{display:flex;gap:8px;margin-top:20px}
.bt{flex:1;padding:14px;border-radius:12px;border:none;font-family:var(--font);font-size:.88rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.bt:active{transform:scale(.98)}
.bm{background:var(--accent);color:#fff}
.bg{background:var(--surface2);color:var(--text2)}
.br{background:var(--red);color:#fff}

/* ── Confirm ── */
.co{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.co.op{opacity:1;pointer-events:all}
.cx{background:var(--surface);border-radius:16px;padding:24px;max-width:300px;width:100%;text-align:center;transform:scale(.9);transition:transform .2s}
.co.op .cx{transform:scale(1)}
.cx h3{font-size:1rem;font-weight:700;margin-bottom:6px}
.cx p{font-size:.82rem;color:var(--text2);margin-bottom:18px}

/* ── Toast ── */
.ts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:500;pointer-events:none}
.to{background:var(--surface);color:var(--text);padding:10px 20px;border-radius:50px;font-size:.8rem;font-weight:500;border:1px solid var(--separator);animation:ti .3s ease,too .3s ease 2.5s forwards;pointer-events:auto}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}
@keyframes too{to{opacity:0}}

.ld svg{animation:sp .8s linear infinite}

/* Light mode override */
@media(prefers-color-scheme:light){
:root{--bg:#F2F2F7;--surface:#FFF;--surface2:#E5E5EA;--text:#000;--text2:rgba(0,0,0,.5);--text3:rgba(0,0,0,.25);--separator:rgba(0,0,0,.06);--accent:#F0883E;--accent-bg:rgba(240,136,62,.1);--green:#34C759;--green-bg:rgba(52,199,89,.1);--blue:#007AFF;--blue-bg:rgba(0,122,255,.1);--yellow:#FF9F0A;--yellow-bg:rgba(255,159,10,.1);--red:#FF3B30;--red-bg:rgba(255,59,48,.1)}
.b-add{box-shadow:0 4px 16px rgba(240,136,62,.25)}
}
</style>
</head>
<body>
<div class="ts" id="ts"></div>
<div class="app">
  <header>
    <button class="gear" id="setBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
    <h1>Colis</h1>
  </header>
  <div id="ls"></div>
</div>

<div class="bottom">
  <button class="b-btn b-search" id="notBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
  <button class="b-btn b-add" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
</div>

<!-- Add/Edit -->
<div class="ov" id="md"><div class="sh"><div class="sh-bar"></div><h2 id="mt">Nouveau colis</h2>
<div class="fd"><label>Nom</label><input id="iN" placeholder="iPhone 16, Nike Air Max…"></div>
<div class="fd"><label>Numéro de suivi</label><input id="iT" placeholder="Colle ton numéro ici"><div class="det" id="det"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span id="dn"></span></div></div>
<div class="fd"><label>Transporteur</label><input id="iC" placeholder="Auto-détecté"></div>
<div class="fd"><label>Statut</label><div class="sg" id="sg"><div class="so sel" data-s="commande">Commandé</div><div class="so" data-s="expedie">Expédié</div><div class="so" data-s="transit">En transit</div><div class="so" data-s="livre">Livré</div></div></div>
<div class="r2"><div class="fd"><label>Livraison estimée</label><input type="date" id="iE"></div><div class="fd"><label>Commandé le</label><input type="date" id="iO"></div></div>
<div class="fd"><label>Note</label><textarea id="iNo" placeholder="Optionnel" rows="2"></textarea></div>
<div class="sbt"><button class="bt bg" id="mc">Annuler</button><button class="bt bm" id="ms">Ajouter</button></div>
</div></div>

<!-- Event -->
<div class="ov" id="em"><div class="sh"><div class="sh-bar"></div><h2>Ajouter une étape</h2>
<div class="fd"><label>Description</label><input id="eD" placeholder="Centre de tri Lyon…"></div>
<div class="r2"><div class="fd"><label>Date</label><input type="date" id="eDt"></div><div class="fd"><label>Heure</label><input type="time" id="eTm"></div></div>
<div class="fd"><label>Lieu</label><input id="eL" placeholder="Optionnel"></div>
<div class="sbt"><button class="bt bg" id="ec">Annuler</button><button class="bt bm" id="es">Ajouter</button></div>
</div></div>

<!-- Settings -->
<div class="ov" id="sm"><div class="sh"><div class="sh-bar"></div><h2>Réglages</h2>
<div class="fd"><label>URL Cloudflare Worker</label><input id="sU" placeholder="https://xxx.workers.dev"><div class="fd-hint">Relie ton Worker Ship24 pour le suivi automatique</div></div>
<div class="sbt"><button class="bt bg" id="sc">Annuler</button><button class="bt bm" id="ss">Enregistrer</button></div>
</div></div>

<!-- Confirm -->
<div class="co" id="cf"><div class="cx"><h3>Supprimer ?</h3><p>Ce colis sera supprimé.</p><div style="display:flex;gap:8px"><button class="bt bg" id="cn">Annuler</button><button class="bt br" id="cy">Supprimer</button></div></div></div>

<script>
const SK='colis-app-data',NK='colis-notif',WK='colis-worker',STS=['commande','expedie','transit','livre'],SL={commande:'Commandé',expedie:'Expédié',transit:'En transit',livre:'Livré'},SI={commande:'🕐',expedie:'📤',transit:'📦',livre:'✓'};
let D=JSON.parse(localStorage.getItem(SK)||'[]'),nf=localStorage.getItem(NK)==='1',wk=localStorage.getItem(WK)||'',eId=null,dId=null,evT=null;
const CS=[{n:'Colissimo',p:[/^[0-9]{11}[A-Z]{2}$/i,/^[0-9]{13}$/],u:t=>'https://www.laposte.fr/outils/suivre-vos-envois?code='+t},{n:'La Poste',p:[/^[A-Z]{2}[0-9]{9}[A-Z]{2}$/i,/^[0-9]{15}$/],u:t=>'https://www.laposte.fr/outils/suivre-vos-envois?code='+t},{n:'Chronopost',p:[/^X[A-Z][0-9]{10}/i],u:t=>'https://www.chronopost.fr/tracking-no-powerful/tracking-unified/?langue=fr&numLT='+t},{n:'UPS',p:[/^1Z[A-Z0-9]{16}$/i],u:t=>'https://www.ups.com/track?tracknum='+t+'&loc=fr_FR'},{n:'FedEx',p:[/^[0-9]{12}$/,/^[0-9]{15}$/,/^[0-9]{22}$/],u:t=>'https://www.fedex.com/fedextrack/?trknbr='+t},{n:'DHL',p:[/^[0-9]{10}$/,/^JJD[0-9]{18}/i],u:t=>'https://www.dhl.com/fr-fr/home/suivi.html?tracking-id='+t},{n:'Mondial Relay',p:[/^[0-9]{8}$/,/^[0-9]{12}$/],u:t=>'https://www.mondialrelay.fr/suivi-de-colis?numExp='+t},{n:'DPD',p:[/^[0-9]{14}$/],u:t=>'https://trace.dpd.fr/fr/trace/'+t},{n:'Amazon',p:[/^TB[A-Z0-9]{10,}/i],u:t=>'https://track.amazon.fr/tracking/'+t},{n:'Cainiao',p:[/^LP[0-9]{14,}/i,/^R[A-Z][0-9]{9}[A-Z]{2}$/i],u:t=>'https://global.cainiao.com/detail.htm?mailNoList='+t}];
function det2(t){if(!t||t.length<6)return null;t=t.trim().replace(/\s/g,'');for(const c of CS)for(const p of c.p)if(p.test(t))return c;return null}
function tUrl(d){if(!d.tracking)return null;const c=det2(d.tracking);return c?c.u(d.tracking.trim()):'https://www.google.com/search?q=suivi+colis+'+encodeURIComponent(d.tracking)}
function mSt(s){if(!s)return null;s=s.toLowerCase();if(s.includes('delivered')||s.includes('pickup'))return'livre';if(s.includes('transit')||s.includes('customs')||s.includes('out_for'))return'transit';if(s.includes('shipped')||s.includes('label')||s.includes('info'))return'expedie';return'transit'}
async function sync(id){const d=D.find(x=>x.id===id);if(!d||!d.tracking||!wk){toast(wk?'Pas de suivi':'Configure l\'API');return}const b=document.querySelector('[data-id="'+id+'"] .d-sync');if(b)b.classList.add('ld');try{const r=await fetch(wk,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'track',trackingNumber:d.tracking})});const j=await r.json();if(j.data&&j.data.trackings&&j.data.trackings[0]){const tk=j.data.trackings[0];if(tk.shipment&&tk.shipment.statusCode){const ns=mSt(tk.shipment.statusCode);if(ns){if(d.status!=='livre'&&ns==='livre'){sN('Livré !',d.name);toast(d.name+' livré !')}d.status=ns}}if(tk.shipment&&tk.shipment.delivery&&tk.shipment.delivery.estimatedDeliveryDate)d.eta=tk.shipment.delivery.estimatedDeliveryDate.split('T')[0];if(tk.events&&tk.events.length){if(!d.events)d.events=[];const ks=new Set(d.events.map(e=>e.desc+e.date));let n=0;tk.events.forEach(ev=>{const dt2=ev.datetime?new Date(ev.datetime):new Date();const ds=ev.status||'Mise à jour';const da=dt2.toISOString().split('T')[0];if(!ks.has(ds+da)){d.events.push({id:gid(),desc:ds,date:da,time:dt2.toTimeString().slice(0,5),location:ev.location||''});ks.add(ds+da);n++}});if(n)toast(n+' étape'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''))}if(!d.source&&tk.events&&tk.events[0]&&tk.events[0].courierCode)d.source=tk.events[0].courierCode;d.updatedAt=Date.now();sv();render()}else toast('Aucune info trouvée')}catch(e){toast('Erreur : '+e.message)}finally{if(b)b.classList.remove('ld')}}
async function aN(){if(!('Notification'in window))return false;if(Notification.permission==='granted')return true;return(await Notification.requestPermission())==='granted'}
function sN(t,b){if(!nf||Notification.permission!=='granted')return;try{new Notification(t,{body:b})}catch(e){}}
function cE(){if(!nf)return;const td=new Date;td.setHours(0,0,0,0);D.forEach(d=>{if(d.status==='livre'||!d.eta)return;const e=new Date(d.eta);e.setHours(0,0,0,0);const df=Math.ceil((e-td)/864e5);const k='n-'+d.id+'-'+df;if(localStorage.getItem(k))return;if(df===0){sN('Aujourd\'hui !',d.name);localStorage.setItem(k,'1')}else if(df===1){sN('Demain',d.name);localStorage.setItem(k,'1')}})}
function sv(){localStorage.setItem(SK,JSON.stringify(D))}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fD(t){return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function toast(m){const t=document.createElement('div');t.className='to';t.textContent=m;_('ts').appendChild(t);setTimeout(()=>t.remove(),3000)}
function gS(){const e=_('sg').querySelector('.sel');return e?e.dataset.s:'commande'}
function sS(s){_('sg').querySelectorAll('.so').forEach(e=>e.classList.toggle('sel',e.dataset.s===s))}
const _=id=>document.getElementById(id);

let dT;_('iT').addEventListener('input',()=>{clearTimeout(dT);dT=setTimeout(()=>{const c=det2(_('iT').value);if(c){_('det').classList.add('on');_('dn').textContent=c.n+' détecté';_('iC').value=c.n;if(gS()==='commande')sS('expedie')}else _('det').classList.remove('on')},300)});

function render(){
  if(!D.length){_('ls').innerHTML='<div class="empty"><p>Appuie sur "+" pour ajouter<br>une nouvelle livraison</p></div>';return}
  _('ls').innerHTML='<div class="list">'+D.map(d=>{
    const si=STS.indexOf(d.status),url=tUrl(d),ev=(d.events||[]).sort((a,b)=>new Date(b.date+'T'+(b.time||'00:00'))-new Date(a.date+'T'+(a.time||'00:00'))),ha=!!wk&&!!d.tracking;
    let eta='';if(d.eta&&d.status!=='livre'){const td=new Date;td.setHours(0,0,0,0);const e=new Date(d.eta);e.setHours(0,0,0,0);const df=Math.ceil((e-td)/864e5);if(df<0)eta='En retard';else if(df===0)eta='Aujourd\'hui';else if(df===1)eta='Demain';else if(df<=7)eta='Dans '+df+' jours'}

  }).join('')+'</div>';
}
