<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Colis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #FAF9F7; --surface: #FFFFFF; --surface-hover: #F5F3F0;
    --text: #1A1817; --text-secondary: #7A7570; --text-tertiary: #B0AAA3;
    --border: #EBE8E4; --accent: #C8612A; --accent-light: #FDF3ED; --accent-hover: #A84F20;
    --success: #2D8A56; --success-light: #EDF7F1;
    --info: #3B7BC0; --info-light: #EDF3FA;
    --warning: #C99220; --warning-light: #FDF7EC;
    --danger: #C94040; --danger-light: #FDECEC;
    --shadow-sm: 0 1px 3px rgba(26,24,23,0.04);
    --shadow-md: 0 4px 16px rgba(26,24,23,0.06);
    --shadow-lg: 0 8px 32px rgba(26,24,23,0.08);
    --radius: 14px; --radius-sm: 10px; --radius-xs: 7px;
    --font-body: 'DM Sans', sans-serif; --font-display: 'Playfair Display', serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100dvh; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  .app { max-width: 520px; margin: 0 auto; padding: 0 20px; padding-bottom: calc(100px + var(--safe-bottom)); }
  header { padding: 48px 0 24px; display: flex; align-items: center; justify-content: space-between; }
  .header-left h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .header-left p { margin-top: 4px; font-size: 0.85rem; color: var(--text-secondary); }
  .notif-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: all 0.2s; position: relative; -webkit-tap-highlight-color: transparent; }
  .notif-btn:hover { border-color: var(--text-tertiary); }
  .notif-btn svg { width: 20px; height: 20px; }
  .notif-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .stats { display: flex; gap: 10px; margin-bottom: 24px; }
  .stat-chip { display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 50px; font-size: 0.78rem; font-weight: 500; background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); }
  .stat-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .stat-chip.active .dot { background: var(--accent); }
  .stat-chip.done .dot { background: var(--success); }
  .stat-chip.total .dot { background: var(--text-tertiary); }
  .filters { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn { padding: 8px 16px; border-radius: 50px; border: 1px solid var(--border); background: var(--surface); font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .filter-btn:hover { border-color: var(--text-tertiary); }
  .filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .empty-state { text-align: center; padding: 60px 20px; animation: fadeUp 0.4s ease; }
  .empty-icon { width: 64px; height: 64px; margin: 0 auto 18px; background: var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
  .empty-state h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
  .empty-state p { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }
  .deliveries { display: flex; flex-direction: column; gap: 12px; }
  .delivery-card { background: var(--surface); border-radius: var(--radius); padding: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: all 0.25s ease; animation: fadeUp 0.35s ease both; cursor: default; overflow: hidden; }
  .delivery-card:hover { box-shadow: var(--shadow-md); border-color: transparent; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-carrier { font-size: 0.78rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .carrier-logo { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--text); }
  .card-tracking-num { font-size: 0.72rem; color: var(--text-tertiary); font-family: monospace; letter-spacing: 0.02em; }
  .card-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .card-btn { width: 34px; height: 34px; border: none; border-radius: var(--radius-xs); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); transition: all 0.15s; -webkit-tap-highlight-color: transparent; font-size: 1rem; text-decoration: none; }
  .card-btn:hover { background: var(--surface-hover); color: var(--text-secondary); }
  .card-btn.delete:hover { background: var(--danger-light); color: var(--danger); }
  .card-btn.track { color: var(--info); }
  .card-btn.track:hover { background: var(--info-light); }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 50px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.01em; text-transform: uppercase; }
  .status-badge.commande { background: var(--info-light); color: var(--info); }
  .status-badge.expedie { background: var(--warning-light); color: var(--warning); }
  .status-badge.transit { background: var(--accent-light); color: var(--accent); }
  .status-badge.livre { background: var(--success-light); color: var(--success); }
  .status-badge svg { width: 12px; height: 12px; }
  .eta-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 50px; font-size: 0.72rem; font-weight: 500; background: var(--surface-hover); color: var(--text-secondary); }
  .eta-badge.soon { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .eta-badge.today { background: var(--success-light); color: var(--success); font-weight: 600; }
  .progress-track { display: flex; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .progress-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
  .progress-step .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); z-index: 1; transition: all 0.3s; }
  .progress-step.done .step-dot { background: var(--success); }
  .progress-step.current .step-dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
  .progress-step .step-label { font-size: 0.65rem; font-weight: 500; color: var(--text-tertiary); text-align: center; }
  .progress-step.done .step-label { color: var(--success); }
  .progress-step.current .step-label { color: var(--accent); font-weight: 600; }
  .progress-line { flex: 1; height: 2px; background: var(--border); margin-top: -18px; }
  .progress-line.done { background: var(--success); }
  .timeline-toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .timeline-toggle span { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); }
  .timeline-toggle svg { width: 16px; height: 16px; color: var(--text-tertiary); transition: transform 0.25s; }
  .timeline-toggle.open svg { transform: rotate(180deg); }
  .timeline { display: none; padding-top: 14px; }
  .timeline.show { display: block; }
  .timeline-event { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
  .timeline-event:last-child { padding-bottom: 0; }
  .timeline-line { display: flex; flex-direction: column; align-items: center; width: 18px; flex-shrink: 0; }
  .timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex-shrink: 0; z-index: 1; }
  .timeline-event:first-child .timeline-dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .timeline-connector { width: 2px; flex: 1; background: var(--border); margin-top: 4px; }
  .timeline-event:last-child .timeline-connector { display: none; }
  .timeline-content { flex: 1; min-width: 0; }
  .timeline-desc { font-size: 0.82rem; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .timeline-meta { font-size: 0.72rem; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
  .add-event-btn { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding: 8px 12px; border-radius: var(--radius-xs); border: 1.5px dashed var(--border); background: transparent; font-family: var(--font-body); font-size: 0.78rem; font-weight: 500; color: var(--text-tertiary); cursor: pointer; width: 100%; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .add-event-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-event-btn svg { width: 14px; height: 14px; }
  .card-date { font-size: 0.73rem; color: var(--text-tertiary); margin-top: 10px; display: flex; align-items: center; gap: 5px; }
  .card-date svg { width: 13px; height: 13px; opacity: 0.6; }
  .fab { position: fixed; bottom: calc(28px + var(--safe-bottom)); right: 50%; transform: translateX(calc(min(260px, 50vw - 20px))); width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--text); color: var(--bg); cursor: pointer; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; transition: all 0.25s; -webkit-tap-highlight-color: transparent; z-index: 100; }
  .fab:hover { transform: translateX(calc(min(260px, 50vw - 20px))) scale(1.08); }
  .fab:active { transform: translateX(calc(min(260px, 50vw - 20px))) scale(0.95); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,24,23,0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 28px 24px calc(24px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); max-height: 90dvh; overflow-y: auto; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; border-radius: 4px; background: var(--border); margin: 0 auto 20px; }
  .modal h2 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; margin-bottom: 24px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 0.9rem; color: var(--text); background: var(--bg); transition: border-color 0.2s; outline: none; -webkit-appearance: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .carrier-detected { display: none; align-items: center; gap: 8px; margin-top: 8px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--success-light); font-size: 0.82rem; font-weight: 500; color: var(--success); animation: fadeUp 0.3s ease; }
  .carrier-detected.show { display: flex; }
  .carrier-detected svg { width: 16px; height: 16px; flex-shrink: 0; }
  .status-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status-option { padding: 11px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 0.82rem; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.2s; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--text-secondary); }
  .status-option:hover { border-color: var(--text-tertiary); }
  .status-option.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 26px; }
  .btn { flex: 1; padding: 14px; border-radius: var(--radius-sm); border: none; font-family: var(--font-body); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { background: #2d2a27; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary { background: var(--surface-hover); color: var(--text-secondary); }
  .btn-secondary:hover { background: var(--border); }
  .confirm-overlay { position: fixed; inset: 0; background: rgba(26,24,23,0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 20px; }
  .confirm-overlay.open { opacity: 1; pointer-events: all; }
  .confirm-box { background: var(--surface); border-radius: var(--radius); padding: 28px 24px 22px; max-width: 340px; width: 100%; text-align: center; transform: scale(0.92); transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1); box-shadow: var(--shadow-lg); }
  .confirm-overlay.open .confirm-box { transform: scale(1); }
  .confirm-box h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; }
  .confirm-box p { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 22px; }
  .confirm-actions { display: flex; gap: 10px; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b33636; }
  .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 50px; font-size: 0.82rem; font-weight: 500; box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards; white-space: nowrap; pointer-events: auto; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }
  .delivery-card:nth-child(1) { animation-delay: 0s; }
  .delivery-card:nth-child(2) { animation-delay: 0.04s; }
  .delivery-card:nth-child(3) { animation-delay: 0.08s; }
  .delivery-card:nth-child(4) { animation-delay: 0.12s; }
  .delivery-card:nth-child(5) { animation-delay: 0.16s; }
  @media (min-width: 600px) { header { padding-top: 56px; } .header-left h1 { font-size: 2.3rem; } .app { padding: 0 28px; padding-bottom: 120px; } }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --surface: #1E1D1B; --surface-hover: #272523; --text: #F0EDEA; --text-secondary: #9A958F; --text-tertiary: #5A5550; --border: #2D2B28; --accent: #E07840; --accent-light: #2A1E14; --accent-hover: #C8612A; --success: #3BA86A; --success-light: #162218; --info: #5A96D8; --info-light: #161E28; --warning: #D8A838; --warning-light: #282214; --danger: #D85A5A; --danger-light: #281616; --shadow-sm: 0 1px 3px rgba(0,0,0,0.15); --shadow-md: 0 4px 16px rgba(0,0,0,0.2); --shadow-lg: 0 8px 32px rgba(0,0,0,0.3); }
    .fab { background: var(--accent); color: #fff; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .toast { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="toast-container" id="toasts"></div>
<div class="app">
  <header>
    <div class="header-left">
      <h1>Colis</h1>
      <p id="subtitle">Aucun colis en cours</p>
    </div>
    <button class="notif-btn" id="notifBtn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    </button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Tout</button>
    <button class="filter-btn" data-filter="commande">Commandé</button>
    <button class="filter-btn" data-filter="expedie">Expédié</button>
    <button class="filter-btn" data-filter="transit">En transit</button>
    <button class="filter-btn" data-filter="livre">Livré</button>
  </div>
  <div class="deliveries" id="deliveries"></div>
</div>
<button class="fab" id="fabBtn" aria-label="Ajouter">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">Nouveau colis</h2>
    <div class="form-group">
      <label>Nom du colis</label>
      <input type="text" id="inputName" placeholder="Ex : iPhone 16, Chaussures Nike…">
    </div>
    <div class="form-group">
      <label>Numéro de suivi</label>
      <input type="text" id="inputTracking" placeholder="Colle ton numéro de suivi ici">
      <div class="carrier-detected" id="carrierDetected">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="carrierDetectedName">Transporteur détecté</span>
      </div>
    </div>
    <div class="form-group">
      <label>Transporteur</label>
      <input type="text" id="inputSource" placeholder="Auto-détecté ou saisir manuellement">
    </div>
    <div class="form-group">
      <label>Statut</label>
      <div class="status-options" id="statusOptions">
        <div class="status-option selected" data-status="commande">Commandé</div>
        <div class="status-option" data-status="expedie">Expédié</div>
        <div class="status-option" data-status="transit">En transit</div>
        <div class="status-option" data-status="livre">Livré</div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Livraison estimée</label>
        <input type="date" id="inputEta">
      </div>
      <div class="form-group">
        <label>Date de commande</label>
        <input type="date" id="inputOrderDate">
      </div>
    </div>
    <div class="form-group">
      <label>Note (optionnel)</label>
      <textarea id="inputNote" placeholder="Détails, lien, remarques…" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnCancel">Annuler</button>
      <button class="btn btn-primary" id="btnSave">Ajouter</button>
    </div>
  </div>
</div>

<!-- ADD EVENT MODAL -->
<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Ajouter une étape</h2>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="eventDesc" placeholder="Ex : Arrivé au centre de tri Lyon">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="eventDate">
      </div>
      <div class="form-group">
        <label>Heure</label>
        <input type="time" id="eventTime">
      </div>
    </div>
    <div class="form-group">
      <label>Lieu (optionnel)</label>
      <input type="text" id="eventLocation" placeholder="Ex : Lyon, Hub Colissimo">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnEventCancel">Annuler</button>
      <button class="btn btn-primary" id="btnEventSave">Ajouter</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <h3>Supprimer ce colis ?</h3>
    <p>Cette action est irréversible.</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="btnConfirmCancel">Annuler</button>
      <button class="btn btn-danger" id="btnConfirmDelete">Supprimer</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'colis-app-data';
const NOTIF_KEY = 'colis-notif-enabled';
const STATUSES = ['commande', 'expedie', 'transit', 'livre'];
const STATUS_LABELS = { commande: 'Commandé', expedie: 'Expédié', transit: 'En transit', livre: 'Livré' };

let deliveries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let notifEnabled = localStorage.getItem(NOTIF_KEY) === 'true';
let currentFilter = 'all';
let editingId = null;
let deletingId = null;
let eventTargetId = null;

// ─── CARRIER DETECTION ───
const CARRIERS = [
  { name: 'Colissimo', patterns: [/^[0-9]{11}[A-Z]{2}$/i, /^[0-9]{13}$/], url: n => 'https://www.laposte.fr/outils/suivre-vos-envois?code=' + n },
  { name: 'La Poste', patterns: [/^[A-Z]{2}[0-9]{9}[A-Z]{2}$/i, /^[0-9]{15}$/], url: n => 'https://www.laposte.fr/outils/suivre-vos-envois?code=' + n },
  { name: 'Chronopost', patterns: [/^[A-Z]{2}[0-9]{9}[A-Z]{2}$/i, /^X[A-Z][0-9]{10}/i], url: n => 'https://www.chronopost.fr/tracking-no-powerful/tracking-unified/?liession=true&langue=fr&numLT=' + n },
  { name: 'UPS', patterns: [/^1Z[A-Z0-9]{16}$/i, /^T[0-9]{10}$/i, /^[0-9]{18}$/], url: n => 'https://www.ups.com/track?tracknum=' + n + '&loc=fr_FR' },
  { name: 'FedEx', patterns: [/^[0-9]{12}$/, /^[0-9]{15}$/, /^[0-9]{20}$/, /^[0-9]{22}$/], url: n => 'https://www.fedex.com/fedextrack/?trknbr=' + n },
  { name: 'DHL', patterns: [/^[0-9]{10}$/, /^JJD[0-9]{18}/i, /^[A-Z]{3}[0-9]{7}$/i], url: n => 'https://www.dhl.com/fr-fr/home/suivi.html?tracking-id=' + n },
  { name: 'Mondial Relay', patterns: [/^[0-9]{8}$/, /^[0-9]{12}$/], url: n => 'https://www.mondialrelay.fr/suivi-de-colis?numExp=' + n },
  { name: 'GLS', patterns: [/^[A-Z0-9]{11}$/i, /^[A-Z0-9]{14}$/i], url: n => 'https://gls-group.eu/FR/fr/suivi-colis?match=' + n },
  { name: 'DPD', patterns: [/^[0-9]{14}$/], url: n => 'https://trace.dpd.fr/fr/trace/' + n },
  { name: 'Amazon Logistics', patterns: [/^TB[A-Z0-9]{10,}/i], url: n => 'https://track.amazon.fr/tracking/' + n },
  { name: 'Cainiao / AliExpress', patterns: [/^LP[0-9]{14,}/i, /^R[A-Z][0-9]{9}[A-Z]{2}$/i, /^AE[0-9]/i], url: n => 'https://global.cainiao.com/detail.htm?mailNoList=' + n },
];

function detectCarrier(tracking) {
  if (!tracking || tracking.length < 6) return null;
  const t = tracking.trim().replace(/\s/g, '');
  for (const c of CARRIERS) {
    for (const p of c.patterns) {
      if (p.test(t)) return c;
    }
  }
  return null;
}

function getTrackingUrl(d) {
  if (!d.tracking) return null;
  const carrier = detectCarrier(d.tracking);
  if (carrier) return carrier.url(d.tracking.trim());
  return 'https://www.google.com/search?q=suivi+colis+' + encodeURIComponent(d.tracking);
}

// ─── NOTIFICATIONS ───
async function requestNotifPermission() {
  if (!('Notification' in window)) { showToast('Notifications non supportées'); return false; }
  if (Notification.permission === 'granted') return true;
  return (await Notification.requestPermission()) === 'granted';
}

function sendNotification(title, body) {
  if (!notifEnabled || Notification.permission !== 'granted') return;
  try { new Notification(title, { body }); } catch(e) {}
}

function checkEtaNotifications() {
  if (!notifEnabled) return;
  const today = new Date(); today.setHours(0,0,0,0);
  deliveries.forEach(d => {
    if (d.status === 'livre' || !d.eta) return;
    const eta = new Date(d.eta); eta.setHours(0,0,0,0);
    const diff = Math.ceil((eta - today) / 86400000);
    const key = 'notif-' + d.id + '-' + d.eta + '-' + diff;
    if (localStorage.getItem(key)) return;
    if (diff === 0) { sendNotification('Livraison aujourd\'hui !', d.name + ' devrait arriver aujourd\'hui.'); localStorage.setItem(key, '1'); }
    else if (diff === 1) { sendNotification('Livraison demain', d.name + ' devrait arriver demain.'); localStorage.setItem(key, '1'); }
  });
}

// ─── ICONS ───
const icons = {
  commande: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  expedie: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  transit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  livre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  delete: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
  track: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  location: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>'
};

// ─── ELEMENTS ───
const _$ = id => document.getElementById(id);
const $deliveries = _$('deliveries'), $stats = _$('stats'), $subtitle = _$('subtitle');
const $modal = _$('modal'), $eventModal = _$('eventModal'), $confirmModal = _$('confirmModal');
const $modalTitle = _$('modalTitle'), $inputName = _$('inputName'), $inputSource = _$('inputSource');
const $inputTracking = _$('inputTracking'), $inputNote = _$('inputNote');
const $inputEta = _$('inputEta'), $inputOrderDate = _$('inputOrderDate');
const $statusOptions = _$('statusOptions'), $btnSave = _$('btnSave'), $filters = _$('filters');
const $carrierDetected = _$('carrierDetected'), $carrierDetectedName = _$('carrierDetectedName');
const $notifBtn = _$('notifBtn');

// ─── HELPERS ───
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(deliveries)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatDate(ts) { return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); }
function formatDateTime(date, time) {
  const d = new Date(date);
  let s = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  if (time) s += ' à ' + time;
  return s;
}
function etaLabel(eta) {
  if (!eta) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const e = new Date(eta); e.setHours(0,0,0,0);
  const diff = Math.ceil((e - today) / 86400000);
  if (diff < 0) return '<span class="eta-badge">Retard</span>';
  if (diff === 0) return '<span class="eta-badge today">Aujourd\'hui !</span>';
  if (diff === 1) return '<span class="eta-badge soon">Demain</span>';
  if (diff <= 3) return '<span class="eta-badge soon">Dans ' + diff + ' jours</span>';
  return '<span class="eta-badge">~ ' + formatDate(e) + '</span>';
}
function showToast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  _$('toasts').appendChild(t); setTimeout(() => t.remove(), 3100);
}
function getSelectedStatus() { const el = $statusOptions.querySelector('.selected'); return el ? el.dataset.status : 'commande'; }
function setSelectedStatus(st) { $statusOptions.querySelectorAll('.status-option').forEach(el => el.classList.toggle('selected', el.dataset.status === st)); }

// ─── AUTO DETECT ───
let dtTO;
$inputTracking.addEventListener('input', () => {
  clearTimeout(dtTO);
  dtTO = setTimeout(() => {
    const c = detectCarrier($inputTracking.value);
    if (c) {
      $carrierDetected.classList.add('show');
      $carrierDetectedName.textContent = c.name + ' détecté';
      $inputSource.value = c.name;
      if (getSelectedStatus() === 'commande') setSelectedStatus('expedie');
    } else {
      $carrierDetected.classList.remove('show');
    }
  }, 300);
});

// ─── RENDER ───
function render() {
  const active = deliveries.filter(d => d.status !== 'livre').length;
  const done = deliveries.filter(d => d.status === 'livre').length;
  $subtitle.textContent = active === 0 ? (deliveries.length === 0 ? 'Aucun colis en cours' : 'Tous livrés !') : active + ' colis en cours';
  $stats.innerHTML = '<div class="stat-chip active"><span class="dot"></span>' + active + ' en cours</div><div class="stat-chip done"><span class="dot"></span>' + done + ' livré' + (done > 1 ? 's' : '') + '</div><div class="stat-chip total"><span class="dot"></span>' + deliveries.length + ' total</div>';
  const filtered = currentFilter === 'all' ? deliveries : deliveries.filter(d => d.status === currentFilter);
  if (filtered.length === 0) {
    $deliveries.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><h3>' + (currentFilter === 'all' ? 'Aucun colis' : 'Aucun colis ici') + '</h3><p>' + (currentFilter === 'all' ? 'Appuie sur + pour ajouter ton premier colis.' : 'Aucun colis avec ce statut.') + '</p></div>';
    return;
  }
  $deliveries.innerHTML = filtered.map(d => {
    const si = STATUSES.indexOf(d.status);
    const trackUrl = getTrackingUrl(d);
    const events = (d.events || []).sort((a,b) => new Date(b.date + 'T' + (b.time||'00:00')) - new Date(a.date + 'T' + (a.time||'00:00')));
    const progressHTML = STATUSES.map((s, i) => {
      const cls = i < si ? 'done' : i === si ? 'current' : '';
      const line = i < STATUSES.length - 1 ? '<div class="progress-line ' + (i < si ? 'done' : '') + '"></div>' : '';
      return '<div class="progress-step ' + cls + '"><div class="step-dot"></div><span class="step-label">' + STATUS_LABELS[s] + '</span></div>' + line;
    }).join('');
    const timelineHTML = events.length > 0 ? events.map(ev => '<div class="timeline-event"><div class="timeline-line"><div class="timeline-dot"></div><div class="timeline-connector"></div></div><div class="timeline-content"><div class="timeline-desc">' + esc(ev.desc) + '</div><div class="timeline-meta">' + formatDateTime(ev.date, ev.time) + (ev.location ? ' · ' + icons.location + ' ' + esc(ev.location) : '') + '</div></div></div>').join('') : '<div style="font-size:0.8rem;color:var(--text-tertiary);padding:4px 0;">Aucune étape enregistrée.</div>';
    return '<div class="delivery-card" data-id="' + d.id + '"><div class="card-top"><div class="card-info"><div class="card-name">' + esc(d.name) + '</div><div class="card-carrier">' + (d.source ? '<span class="carrier-logo">' + esc(d.source) + '</span>' : '') + (d.tracking ? '<span class="card-tracking-num">' + esc(d.tracking) + '</span>' : '') + '</div></div><div class="card-actions">' + (trackUrl ? '<a class="card-btn track" href="' + trackUrl + '" target="_blank" rel="noopener" aria-label="Suivre">' + icons.track + '</a>' : '') + '<button class="card-btn edit" onclick="openEdit(\'' + d.id + '\')" aria-label="Modifier">' + icons.edit + '</button><button class="card-btn delete" onclick="openDelete(\'' + d.id + '\')" aria-label="Supprimer">' + icons.delete + '</button></div></div><div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;"><span class="status-badge ' + d.status + '">' + icons[d.status] + ' ' + STATUS_LABELS[d.status] + '</span>' + (d.status !== 'livre' ? etaLabel(d.eta) : '') + '</div><div class="progress-track">' + progressHTML + '</div><div class="timeline-toggle" onclick="toggleTimeline(this)"><span>Détails du suivi (' + events.length + ')</span>' + icons.chevron + '</div><div class="timeline">' + timelineHTML + '<button class="add-event-btn" onclick="openEventModal(\'' + d.id + '\')">' + icons.plus + ' Ajouter une étape</button></div>' + (d.note ? '<div class="card-date" style="color:var(--text-secondary);font-size:0.8rem;margin-top:10px;">' + esc(d.note) + '</div>' : '') + '<div class="card-date">' + icons.calendar + ' ' + formatDate(d.updatedAt || d.createdAt) + '</div></div>';
  }).join('');
}

function toggleTimeline(el) { el.classList.toggle('open'); el.nextElementSibling.classList.toggle('show'); }

// ─── MODAL ───
function openModal() {
  editingId = null; $modalTitle.textContent = 'Nouveau colis'; $btnSave.textContent = 'Ajouter';
  $inputName.value = ''; $inputSource.value = ''; $inputTracking.value = ''; $inputNote.value = '';
  $inputEta.value = ''; $inputOrderDate.value = new Date().toISOString().split('T')[0];
  $carrierDetected.classList.remove('show'); setSelectedStatus('commande');
  $modal.classList.add('open'); setTimeout(() => $inputName.focus(), 350);
}
function openEdit(id) {
  const d = deliveries.find(x => x.id === id); if (!d) return;
  editingId = id; $modalTitle.textContent = 'Modifier'; $btnSave.textContent = 'Enregistrer';
  $inputName.value = d.name; $inputSource.value = d.source || ''; $inputTracking.value = d.tracking || '';
  $inputNote.value = d.note || ''; $inputEta.value = d.eta || ''; $inputOrderDate.value = d.orderDate || '';
  setSelectedStatus(d.status);
  const c = detectCarrier(d.tracking);
  if (c) { $carrierDetected.classList.add('show'); $carrierDetectedName.textContent = c.name + ' détecté'; }
  else { $carrierDetected.classList.remove('show'); }
  $modal.classList.add('open'); setTimeout(() => $inputName.focus(), 350);
}
function closeModal() { $modal.classList.remove('open'); }
function saveDelivery() {
  const name = $inputName.value.trim(); if (!name) { $inputName.focus(); return; }
  const oldStatus = editingId ? (deliveries.find(x => x.id === editingId) || {}).status : null;
  const newStatus = getSelectedStatus();
  const data = { name, source: $inputSource.value.trim(), tracking: $inputTracking.value.trim(), note: $inputNote.value.trim(), status: newStatus, eta: $inputEta.value || null, orderDate: $inputOrderDate.value || null, updatedAt: Date.now() };
  if (editingId) {
    const idx = deliveries.findIndex(x => x.id === editingId);
    if (idx !== -1) {
      deliveries[idx] = { ...deliveries[idx], ...data };
      if (oldStatus && oldStatus !== newStatus) {
        if (!deliveries[idx].events) deliveries[idx].events = [];
        const now = new Date();
        deliveries[idx].events.push({ id: genId(), desc: 'Statut → ' + STATUS_LABELS[newStatus], date: now.toISOString().split('T')[0], time: now.toTimeString().slice(0,5), location: '' });
        if (newStatus === 'livre') { sendNotification('Colis livré !', name + ' a été marqué comme livré.'); showToast(name + ' marqué comme livré !'); }
      }
    }
  } else {
    deliveries.unshift({ id: genId(), ...data, createdAt: Date.now(), events: [{ id: genId(), desc: 'Commande enregistrée', date: new Date().toISOString().split('T')[0], time: new Date().toTimeString().slice(0,5), location: '' }] });
  }
  save(); render(); closeModal();
}

// ─── EVENT MODAL ───
function openEventModal(deliveryId) {
  eventTargetId = deliveryId; _$('eventDesc').value = '';
  _$('eventDate').value = new Date().toISOString().split('T')[0];
  _$('eventTime').value = new Date().toTimeString().slice(0,5);
  _$('eventLocation').value = '';
  $eventModal.classList.add('open'); setTimeout(() => _$('eventDesc').focus(), 350);
}
function closeEventModal() { $eventModal.classList.remove('open'); }
function saveEvent() {
  const desc = _$('eventDesc').value.trim(); if (!desc) { _$('eventDesc').focus(); return; }
  const d = deliveries.find(x => x.id === eventTargetId); if (!d) return;
  if (!d.events) d.events = [];
  d.events.push({ id: genId(), desc, date: _$('eventDate').value, time: _$('eventTime').value, location: _$('eventLocation').value.trim() });
  d.updatedAt = Date.now(); save(); render(); closeEventModal(); showToast('Étape ajoutée');
}

// ─── DELETE ───
function openDelete(id) { deletingId = id; $confirmModal.classList.add('open'); }
function closeConfirm() { $confirmModal.classList.remove('open'); deletingId = null; }
function confirmDelete() { if (!deletingId) return; deliveries = deliveries.filter(x => x.id !== deletingId); save(); render(); closeConfirm(); }

// ─── NOTIF TOGGLE ───
function updateNotifBtn() { $notifBtn.classList.toggle('active', notifEnabled); }
$notifBtn.addEventListener('click', async () => {
  if (notifEnabled) { notifEnabled = false; localStorage.setItem(NOTIF_KEY, 'false'); showToast('Notifications désactivées'); }
  else { const ok = await requestNotifPermission(); if (ok) { notifEnabled = true; localStorage.setItem(NOTIF_KEY, 'true'); showToast('Notifications activées !'); } else { showToast('Permission refusée'); } }
  updateNotifBtn();
});

// ─── EVENTS ───
_$('fabBtn').addEventListener('click', openModal);
_$('btnCancel').addEventListener('click', closeModal);
_$('btnSave').addEventListener('click', saveDelivery);
_$('btnEventCancel').addEventListener('click', closeEventModal);
_$('btnEventSave').addEventListener('click', saveEvent);
_$('btnConfirmCancel').addEventListener('click', closeConfirm);
_$('btnConfirmDelete').addEventListener('click', confirmDelete);
$modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
$eventModal.addEventListener('click', e => { if (e.target === $eventModal) closeEventModal(); });
$confirmModal.addEventListener('click', e => { if (e.target === $confirmModal) closeConfirm(); });
$statusOptions.addEventListener('click', e => { const o = e.target.closest('.status-option'); if (o) setSelectedStatus(o.dataset.status); });
$filters.addEventListener('click', e => { const b = e.target.closest('.filter-btn'); if (!b) return; $filters.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); currentFilter = b.dataset.filter; render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($confirmModal.classList.contains('open')) closeConfirm(); else if ($eventModal.classList.contains('open')) closeEventModal(); else if ($modal.classList.contains('open')) closeModal(); }
});

updateNotifBtn(); render(); checkEtaNotifications();
setInterval(checkEtaNotifications, 30 * 60 * 1000);
</script>
